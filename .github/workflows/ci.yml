name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Skip release-please PRs (CHANGELOG.md + manifest): GITHUB_TOKEN-authored
    # PRs trigger GitHub's 'Approve and run' gate on pull_request workflows.
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
  # GITHUB_TOKEN pushes (release-please auto-merge) do not trigger push
  # events — allow manual dispatch to run CI on such commits.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Same gate as the local prek hook: hygiene builtins + the workflow
      # script syntax check (scripts/check-workflow-syntax.mjs). All hooks
      # are builtin/local — no network fetches, no secrets.
      - name: Install prek
        run: pipx install prek

      - name: Run prek hooks (all files)
        run: prek run -a
