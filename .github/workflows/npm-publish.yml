name: Publish npm

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Checkpoint-bridge tag to publish (e.g. checkpoint-bridge-v1.2.3)'
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  # Enables npm OIDC trusted publishing — no NPM_TOKEN secret required.
  id-token: write

jobs:
  publish:
    # Only the checkpoint-bridge extension's releases publish to npm.
    # (Root releases tag `vX.Y.Z`; the bridge tags `checkpoint-bridge-vX.Y.Z`.)
    # On workflow_dispatch the tag input selects the ref — the default-branch
    # HEAD is never published (that would publish a tree different from the
    # released one).
    if: startsWith(github.event.release.tag_name || inputs.tag || '', 'checkpoint-bridge-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm publish --access public
        working-directory: extensions/checkpoint-bridge
