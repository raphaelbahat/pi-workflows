name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please parses conventional commits, opens/updates a Release PR
      # (CHANGELOG.md), and publishes the tag + GitHub Release when it merges.
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Fully automated releases: merge the Release PR immediately. Publishing
      # is handled by release-publish.yml (workflow_run escape hatch: pushes
      # made with GITHUB_TOKEN do not trigger workflows).
      - name: Auto-merge the Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR=""
          if [ -n "$PR_JSON" ] && [ "$PR_JSON" != "null" ]; then
            PR=$(printf '%s' "$PR_JSON" | jq -r '.prNumber // empty')
          fi
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" \
                   --head "release-please--branches--master" --state open \
                   --json number --jq '.[0].number // empty')
          fi
          if [ -n "$PR" ]; then
            echo "Merging Release PR #$PR"
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge
          else
            echo "No Release PR to merge."
          fi
