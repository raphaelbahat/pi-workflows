name: Release Publish

on:
  workflow_run:
    workflows: ['Release Please']
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Second release-please pass: the Release PR was auto-merged by
      # release-please.yml, so this pass creates the tag + GitHub Release.
      # npm publishing is a SEPARATE workflow (npm-publish.yml) triggered by
      # the release `published` event — v4's paths_released output is not
      # reliably JSON (a root `.` package emits the bare string `.`), which
      # crashed fromJSON() here (run 34129690375).
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
