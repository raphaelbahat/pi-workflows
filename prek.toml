# prek configuration for the pi-workflows repository.
# Shape mirrors raphaelbahat/coding-skills (~/.config/skillshare): universal
# hygiene builtins. agnix/rumdl/shellcheck are skill-, markdown-, and
# shell-specific and deliberately not adopted — this repo is JavaScript-only.
# See: https://prek.j178.dev/

minimum_prek_version = "0.4.5"

# ── JavaScript syntax gate ───────────────────────────────────────────────
# pi-subagents workflow scripts compile as an async function body (top-level
# `return`/`await` are legal; the `export const meta` header is loader
# metadata), so they cannot pass a bare `node --check`. The gate reproduces
# the engine's wrapper shape before syntax-checking.
[[repos]]
repo = "local"
hooks = [
  { id = "workflow-syntax", name = "workflow script syntax (node --check, pi-subagents wrapper shape)", entry = "node scripts/check-workflow-syntax.mjs", language = "system", files = "\\.js$" },
]

# ── Biome lint/format gate (scripts/ only) ─────────────────────────────
# The four root pi-plugin-*.js workflow scripts have top-level return/await
# (pi-subagents wrapper shape) and must NEVER be run through Biome. biome.json
# scopes the project to scripts/** (files.includes) and ignores the root
# pi-plugin-*.js via overrides; this hook further restricts files to ^scripts/.
[[repos]]
repo = "local"
hooks = [
  { id = "biome", name = "Biome check (scripts/ only)", entry = "npx biome check", language = "system", files = "^scripts/" },
]

# ── GitHub Actions workflow lint gate ───────────────────────────────────
# rhysd/actionlint pre-commit repo (language: golang — Go is preinstalled on
# GitHub runners). The actionlint binary is NOT on CI runner PATH, so a
# local system hook fails there; the remote repo form auto-provisions it.
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # v1.7.12
hooks = [
  { id = "actionlint" },
]

# ── Built-in hooks (offline, Rust-native) ────────────────────────────────
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]
